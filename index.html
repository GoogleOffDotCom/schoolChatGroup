<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPMS Chat Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: Arial, sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Login Overlay */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .login-box {
      background-color: #1e293b;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 360px;
      color: #ffffff;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .login-box p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #334155;
      border-radius: 6px;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .input-field:focus {
      border-color: #3b82f6;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-btn:hover {
      background-color: #2563eb;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="login-overlay">
    <div class="login-box">
      <h2>FPMS Chat Portal</h2>
      <p>Enter your display name and password to join.</p>
      
      <input 
        type="text" 
        id="username" 
        class="input-field" 
        placeholder="Display Name" 
        autocomplete="off" 
      />
      
      <input 
        type="password" 
        id="password" 
        class="input-field" 
        placeholder="Password" 
        autocomplete="new-password" 
      />
      
      <button class="login-btn" onclick="handleLogin()">Enter Chat</button>
    </div>
  </div>

  <!-- WidgetBot Embed -->
  <iframe 
    src="https://e.widgetbot.io/channels/1567321941654634506/1567321943097614379" 
    title="FPMS Discord Chat"
    allow="fullscreen; clipboard-write; encrypted-media">
  </iframe>

  <script>
    // Auto-login if session is already stored in browser
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('fpms_chat_username');
      if (savedUser) {
        document.getElementById('login-overlay').classList.add('hidden');
      }
    });

    function handleLogin() {
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      if (!usernameInput || !passwordInput) {
        alert('Please enter both a username and password.');
        return;
      }

      // Save credentials in browser storage (persists until cache/cookies are cleared)
      localStorage.setItem('fpms_chat_username', usernameInput);
      localStorage.setItem('fpms_chat_password', passwordInput);

      // Unlock and show chat
      document.getElementById('login-overlay').classList.add('hidden');
    }
  </script>

</body>
</html>
